[project]
name = "kairix-apps"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "aiofiles>=24.1.0",
    "elevenlabs>=2.3.0",
    "fastapi>=0.115.13",
    "ffprobe>=0.5",
    "httpx>=0.28.1",
    "kairix-core",
    "neomodel>=5.5.0",
    "openai>=1.86.0",
    "openai-agents<0.1.0",
    "pudb>=2025.1",
    "pydantic>=2.11.7",
    "pydub>=0.25.1",
    "python-dotenv<1.11.1",
    "pyyaml>=6.0.2",
    "sentence-transformers>=4.1.0",
    "ty>=0.0.1a9",
    "uvicorn>=0.34.3",
]

[project.optional-dependencies]
dev = [
    "ty>=0.0.1a9",
    "ruff>=0.2.0",
    "pytest>=8.0.0",
    "ruff-lsp>=0.0.53",
    "python-lsp-server>=1.11.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["uv_build>=0.7.8"]
build-backend = "uv_build"

# Ruff configuration
[tool.ruff]
target-version = "py310"
line-length = 120
fix = true
src = ["src"]

[tool.uv]
package = true

[tool.uv.sources]
kairix-core = { path = "../kairix-core", editable = true }

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
    "TCH",  # flake8-type-checking
    "RUF",  # Ruff-specific
    "ASYNC",# flake8-async - Check for common async/await mistakes
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


# Pytest configuration
[tool.pytest.ini_options]
addopts = [
    "--strict-markers",
    "-v",
]
testpaths = ["tests"]
markers = [
    "asyncio: marks tests as async (deselect with '-m \"not asyncio\"')",
]

# Typeguard configuration
[tool.typeguard]
# Automatically check all functions in your package
packages = ["kairix_apps"]
# Forward references work automatically
forward_ref_policy = "RESOLVE"
# Check collection types deeply
collection_check_strategy = "ALL_ITEMS"

# Mypy configuration for better type checking
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Temporarily disabled to focus on async issues
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false  # Temporarily disabled
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false  # Temporarily disabled
warn_no_return = true
warn_unreachable = true
strict_equality = true
# Enable strict async checking
enable_error_code = ["unused-awaitable", "redundant-expr", "truthy-bool"]
# Ignore missing imports for external packages
ignore_missing_imports = true
# Add kairix-core source to mypy path
mypy_path = "../kairix-core/src"

[dependency-groups]
dev = [
    "mypy>=1.16.1",
    "pip>=25.1.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.2",
]
