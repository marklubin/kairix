<!DOCTYPE html>
<html>
<head>
    <title>Debug STT Issue</title>
</head>
<body>
    <h1>Debug Speech Recognition</h1>
    <button id="test1">Test 1: Basic Recognition</button>
    <button id="test2">Test 2: With Continuous</button>
    <button id="test3">Test 3: Recreate Instance</button>
    <div id="log" style="white-space: pre; font-family: monospace; background: #f0f0f0; padding: 10px; margin: 10px 0;"></div>
    
    <script>
        const log = (msg) => {
            document.getElementById('log').textContent += msg + '\n';
            console.log(msg);
        };
        
        // Test 1: Basic recognition
        document.getElementById('test1').onclick = () => {
            log('\n=== Test 1: Basic Recognition ===');
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            
            recognition.onstart = () => log('onstart fired');
            recognition.onresult = (e) => log('onresult fired: ' + e.results[0][0].transcript);
            recognition.onerror = (e) => log('onerror fired: ' + e.error);
            recognition.onend = () => log('onend fired');
            
            recognition.start();
            log('start() called');
        };
        
        // Test 2: With continuous and interim
        document.getElementById('test2').onclick = () => {
            log('\n=== Test 2: With Continuous ===');
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.continuous = true;
            recognition.interimResults = true;
            
            recognition.onstart = () => log('onstart fired');
            recognition.onresult = (e) => {
                log('onresult fired');
                for (let i = 0; i < e.results.length; i++) {
                    log(`  Result ${i}: "${e.results[i][0].transcript}" (final: ${e.results[i].isFinal})`);
                }
            };
            recognition.onerror = (e) => log('onerror fired: ' + e.error);
            recognition.onend = () => log('onend fired');
            
            recognition.start();
            log('start() called with continuous=true, interimResults=true');
            
            setTimeout(() => {
                log('Stopping after 5 seconds...');
                recognition.stop();
            }, 5000);
        };
        
        // Test 3: Recreate instance (like the provider does)
        document.getElementById('test3').onclick = async () => {
            log('\n=== Test 3: Recreate Instance ===');
            
            // First get microphone permission
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                log('Microphone permission granted');
            } catch (e) {
                log('Microphone error: ' + e.message);
                return;
            }
            
            // Create recognition
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';
            recognition.maxAlternatives = 1;
            
            // Store results
            let allTranscript = '';
            
            // Set up handlers
            recognition.onstart = () => log('onstart fired');
            
            recognition.onresult = (event) => {
                log('onresult fired, results.length=' + event.results.length);
                allTranscript = '';
                for (let i = 0; i < event.results.length; i++) {
                    allTranscript += event.results[i][0].transcript + ' ';
                }
                log('Current transcript: ' + allTranscript);
            };
            
            recognition.onerror = (event) => {
                log('onerror fired: ' + event.error);
            };
            
            recognition.onend = () => {
                log('onend fired');
                log('Final transcript: ' + allTranscript);
            };
            
            // Additional events
            recognition.onaudiostart = () => log('onaudiostart fired');
            recognition.onsoundstart = () => log('onsoundstart fired');
            recognition.onspeechstart = () => log('onspeechstart fired');
            
            recognition.start();
            log('start() called');
        };
    </script>
</body>
</html>
