[project]
name = "kairix-common"
version = "0.1.0"
description = "Shared types and utilities for Kairix projects"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kairix_common"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "ANN",    # flake8-annotations
    "B",      # flake8-bugbear
    "RUF",    # ruff-specific
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
