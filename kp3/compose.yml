# =============================================================================
# KP3 - Knowledge Processing Pipeline
# =============================================================================
# This service uses the shared kairix-postgres from v2-runtime.
# Database 'kp3' must exist in kairix-postgres with user 'kp3'.
#
# Usage:
#   # Build the image
#   podman-compose build
#
#   # Run a job (ephemeral)
#   podman-compose run --rm kp3 passage ls
#   podman-compose run --rm kp3 sql "SELECT COUNT(*) FROM passages"
#
#   # Import data (mount the file)
#   podman-compose run --rm -v /path/to/mark.db:/data/mark.db:ro kp3 importer kairix /data/mark.db
#
# =============================================================================

services:
  kp3:
    build:
      context: .
      dockerfile: Dockerfile
    image: kp3:latest
    environment:
      KP3_DATABASE_URL: postgresql+asyncpg://kp3:kp3@kairix-postgres:5432/kp3
      KP3_OLLAMA_HOST: http://host.containers.internal:11434
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    extra_hosts:
      - "host.containers.internal:host-gateway"
    networks:
      - kairix-net

networks:
  kairix-net:
    external: true
    name: v2-runtime_kairix-net
