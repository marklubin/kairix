[project]
name = "kairix-tools"
version = "0.1.0"
description = "Kairix infrastructure tools - SRE Agent and User Management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "psutil>=5.9.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "pydantic>=2.0.0",
    "sqlite-utils>=3.0.0",
    "python-dateutil>=2.8.0",
    "typer>=0.9.0",
    "structlog>=24.0.0",
    "click>=8.0.0",
    "bcrypt>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
kairix-sre = "sre_agent.main:app"
kairixctl = "kairixctl:cli"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true