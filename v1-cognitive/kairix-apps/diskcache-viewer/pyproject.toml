[project]
name = "kairix-notebook-viewer"
version = "0.1.0"
description = "A TUI for viewing and editing kairix persona notebook entries"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.83.0",
    "rich>=13.7.0",
    "diskcache>=5.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_functions = ["test_*"]
