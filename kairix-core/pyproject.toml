[build-system]
requires = ["uv_build>=0.7.8"]
build-backend = "uv_build"

[project]
name = "kairix-core"
version = "0.1.0"
description = "Core functionality for Kairix"
readme = "README.md"
authors = [
    { name = "Mark Lubin", email = "melubin@pm.me" }
]
requires-python = ">=3.10,<3.11"
dependencies = [
    "elevenlabs>=2.3.0",
    "httpx>=0.28.1",
    "neomodel>=5.5.0",
    "openai>=1.86.0",
    "openai-agents>=0.0.17",
    "pydub>=0.25.1",
    "rich>=14.0.0",
    "sentence-transformers>=4.1.0",
    "pydantic>=2.11.5",
    "neomodel>=5.5.0",
    "chatformat>=1.2",
    "huggingface-hub>=0.32.4",
    "llama-cpp-python @https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.4-metal/llama_cpp_python-0.3.4-cp310-cp310-macosx_11_0_arm64.whl ; sys_platform== 'darwin' and platform_machine == 'arm64'",
    "llama-cpp-python @https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.4-cu121/llama_cpp_python-0.3.4-cp310-cp310-linux_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "wireup>=2.0.0",
    "spacy>=3.8.7",
    "textblob>=0.19.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sse-starlette>=1.6.0",
    "debugpy>=1.8.14",
    "dynaconf>=3.2.11",
]


[dependency-groups]
dev = [
    "ruff>=0.8.7,<1.0.0",
    "ty>=0.0.1a8,<1.0.0",
    "pytest>=8.4.0,<9.0.0",
    "mypy>=1.16.1",
    "pytest-asyncio>=1.0.0",
]


[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py310"


[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
# Enable strict async checking
enable_error_code = ["unused-awaitable", "redundant-expr", "truthy-bool"]
# Ignore missing imports for external packages
ignore_missing_imports = true
