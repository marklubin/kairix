Thank youversion: '3.8'

services:
  client-${USER_ID}:
    build: 
      context: ./kairix-apps/client
      dockerfile: Dockerfile
    container_name: kairix-client-${USER_ID}
    environment:
      - VITE_API_URL=http://api-${USER_ID}:8000
      - VITE_API_KEY=${USER_API_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.client-${USER_ID}.rule=Host(`${USER_ID}.localhost`)"
      - "traefik.http.services.client-${USER_ID}.loadbalancer.server.port=8888"
      - "traefik.http.routers.client-${USER_ID}.entrypoints=web"
    depends_on:
      - api-${USER_ID}
    networks:
      - kairix-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  api-${USER_ID}:
    build: 
      context: ./kairix-apps
      dockerfile: Dockerfile
    container_name: kairix-api-${USER_ID}
    environment:
      - NEO4J_URI=bolt://neo4j-${USER_ID}:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - API_KEY=${USER_API_KEY}
      - USER_ID=${USER_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SENTENCE_TRANSFORMERS_HOME=/app/.cache
    volumes:
      - api-${USER_ID}-cache:/app/.cache
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-${USER_ID}.rule=Host(`${USER_ID}.localhost`) && PathPrefix(`/api`)"
      - "traefik.http.services.api-${USER_ID}.loadbalancer.server.port=8000"
      - "traefik.http.routers.api-${USER_ID}.entrypoints=web"
      - "traefik.http.middlewares.api-${USER_ID}-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.api-${USER_ID}.middlewares=api-${USER_ID}-strip"
    depends_on:
      - neo4j-${USER_ID}
    networks:
      - kairix-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  neo4j-${USER_ID}:
    image: neo4j:5.25.1
    container_name: kairix-neo4j-${USER_ID}
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc", "graph-data-science", "n10s", "neosemantics"]
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_db_tx__log_rotation_retention__policy=1 files
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,genai.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,genai.*
    volumes:
      - neo4j-${USER_ID}-data:/data
      - neo4j-${USER_ID}-logs:/logs
    networks:
      - kairix-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

volumes:
  neo4j-${USER_ID}-data:
  neo4j-${USER_ID}-logs:
  api-${USER_ID}-cache:

networks:
  kairix-network:
    external: true