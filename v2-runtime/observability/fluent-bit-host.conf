# Fluent Bit Host Configuration for Kairix
# Reads container logs from user journald and sends to OpenObserve
#
# Install: kx logs:setup
# Status:  kx logs:status
# Logs:    journalctl --user -u fluent-bit -f

[SERVICE]
    Flush        5
    Log_Level    info
    Daemon       Off

# Read from user journald - filter for container logs
[INPUT]
    Name              systemd
    Tag               container.*
    Systemd_Filter    CONTAINER_NAME=kairix-server
    Systemd_Filter    CONTAINER_NAME=kairix-worker
    Systemd_Filter    CONTAINER_NAME=kp3-service
    Systemd_Filter    CONTAINER_NAME=letta
    Systemd_Filter    CONTAINER_NAME=kairix-postgres
    Systemd_Filter    CONTAINER_NAME=kairix-redis
    Systemd_Filter    CONTAINER_NAME=metamcp
    Systemd_Filter    CONTAINER_NAME=openobserve
    Read_From_Tail    On
    Strip_Underscores On

# Extract container name and clean up fields
[FILTER]
    Name          record_modifier
    Match         *
    Remove_key    _BOOT_ID
    Remove_key    _CAP_EFFECTIVE
    Remove_key    _CMDLINE
    Remove_key    _EXE
    Remove_key    _MACHINE_ID
    Remove_key    _PID
    Remove_key    _SELINUX_CONTEXT
    Remove_key    _SOURCE_REALTIME_TIMESTAMP
    Remove_key    _SYSTEMD_CGROUP
    Remove_key    _SYSTEMD_INVOCATION_ID
    Remove_key    _SYSTEMD_SLICE
    Remove_key    _SYSTEMD_UNIT
    Remove_key    _SYSTEMD_USER_SLICE
    Remove_key    _SYSTEMD_USER_UNIT
    Remove_key    _TRANSPORT
    Remove_key    _AUDIT_LOGINUID
    Remove_key    _AUDIT_SESSION
    Remove_key    _COMM
    Remove_key    _GID
    Remove_key    _HOSTNAME
    Remove_key    _RUNTIME_SCOPE
    Remove_key    _SYSTEMD_OWNER_UID
    Remove_key    _UID
    Remove_key    CODE_FILE
    Remove_key    CODE_FUNC
    Remove_key    CODE_LINE
    Remove_key    CONTAINER_ID_FULL

# Rename fields for cleaner output
[FILTER]
    Name          modify
    Match         *
    Rename        MESSAGE log
    Rename        CONTAINER_NAME container
    Rename        CONTAINER_ID container_id
    Rename        SYSLOG_IDENTIFIER source
    Rename        PRIORITY priority
    Add           service kairix

# Send to OpenObserve HTTP API
[OUTPUT]
    Name              http
    Match             *
    Host              localhost
    Port              5080
    URI               /api/default/default/_json
    Format            json
    Json_Date_Key     _timestamp
    Json_Date_Format  iso8601
    HTTP_User         admin@kairix.local
    HTTP_Passwd       kairix123
    Retry_Limit       3
