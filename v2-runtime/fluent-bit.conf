# Fluent Bit configuration for Kairix
# Receives container logs via fluentd protocol and sends to OpenObserve

[SERVICE]
    Flush        5
    Log_Level    info

# Listen for logs from containers using fluentd log driver
[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24224

# Add service tag for OpenObserve
[FILTER]
    Name    modify
    Match   *
    Add     service kairix

# Send to OpenObserve HTTP API
[OUTPUT]
    Name              http
    Match             *
    Host              openobserve
    Port              5080
    URI               /api/default/default/_json
    Format            json
    Json_Date_Key     _timestamp
    Json_Date_Format  iso8601
    Http_User         admin@kairix.local
    Http_Passwd       kairix123
