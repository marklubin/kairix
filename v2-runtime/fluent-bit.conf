# Fluent Bit configuration for Kairix
# Collects container logs from journald and sends to OpenObserve

[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              systemd
    Tag               podman.*
    Systemd_Filter    _SYSTEMD_UNIT=podman*
    Read_From_Tail    On

[FILTER]
    Name    modify
    Match   *
    Add     service kairix

[OUTPUT]
    Name              http
    Match             *
    Host              openobserve
    Port              5080
    URI               /api/default/default/_json
    Format            json
    Json_Date_Key     timestamp
    Json_Date_Format  iso8601
    Http_User         admin@kairix.local
    Http_Passwd       kairix123
