# =============================================================================
# Kairix Docker Compose - Consolidated Configuration
# =============================================================================
# Usage:
#   Default (everything):    docker compose up -d
#   Dependencies only:       COMPOSE_PROFILES= docker compose up -d
#   Run migrations:          docker compose run --rm migrate
#   Run kp3 CLI:             docker compose run --rm kp3 kp3 passage search "query"
#
# Requires COMPOSE_PROFILES=app in .env for default behavior to start all services

networks:
  kairix-net:
    driver: bridge

volumes:
  kairix-pgdata:
    external: true
    name: agent-server_kairix-pgdata
  openobserve-data:

services:
  # ===========================================================================
  # INFRASTRUCTURE (no profile = always starts)
  # ===========================================================================

  postgres:
    image: pgvector/pgvector:pg16
    container_name: kairix-postgres
    environment:
      POSTGRES_USER: kairix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kairix}
      POSTGRES_DB: kairix
    volumes:
      - kairix-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairix -d kairix"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - kairix-net

  redis:
    image: redis:7-alpine
    container_name: kairix-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - kairix-net

  letta:
    image: letta/letta:latest
    container_name: letta
    ports:
      - "9000:8283"
    volumes:
      - .letta/.persist/pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - LETTA_DEBUG=False
      - VLLM_API_BASE=http://vllm:8000
    depends_on:
      vllm:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kairix-net

  # ===========================================================================
  # Monitoring & Debugging
  # ===========================================================================

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - kairix-net

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: openobserve
    ports:
      - "5080:5080"    # UI + API
      - "5081:5081"    # OTLP gRPC
    environment:
      - ZO_ROOT_USER_EMAIL=admin@kairix.local
      - ZO_ROOT_USER_PASSWORD=kairix123
      - ZO_DATA_DIR=/data
    volumes:
      - openobserve-data:/data
    restart: unless-stopped
    networks:
      - kairix-net

  # NOTE: Fluent Bit runs on host, not in container (see kx logs:setup)
  # This is required because Podman logs to user journald which containers can't access

  # ===========================================================================
  # MCP Gateway & Proxies
  # ===========================================================================

  metamcp:
    image: ghcr.io/metatool-ai/metamcp:latest
    container_name: metamcp
    ports:
      - "12008:12008"
    env_file:
      - metamcp.env
    volumes:
      - /home/mark/mcp-email-server:/opt/mcp-email-server
      - /home/mark/cert.pem:/opt/certs/cert.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kairix-net

  pmb-imap-proxy:
    image: alpine/socat
    container_name: pmb-imap-proxy
    command: TCP-LISTEN:1143,fork,reuseaddr TCP:host.containers.internal:1143
    extra_hosts:
      - "host.containers.internal:host-gateway"
    restart: unless-stopped
    networks:
      - kairix-net

  pmb-smtp-proxy:
    image: alpine/socat
    container_name: pmb-smtp-proxy
    command: TCP-LISTEN:1025,fork,reuseaddr TCP:host.containers.internal:1025
    extra_hosts:
      - "host.containers.internal:host-gateway"
    restart: unless-stopped
    networks:
      - kairix-net

  # ===========================================================================
  # vLLM Inference Server
  # ===========================================================================

  vllm:
    image: vllm/vllm-openai:v0.8.5
    container_name: vllm
    ports:
      - "8001:8000"
    environment:
      - VLLM_USE_V1=0
      - HF_HOME=/root/.cache/huggingface
      - CUDA_VISIBLE_DEVICES=0
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-16384}
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --enable-prefix-caching
      --gpu-memory-utilization 0.85
    volumes:
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
    devices:
      - nvidia.com/gpu=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Model loading takes time
    deploy:
      resources:
        limits:
          memory: 24G
        reservations:
          memory: 16G
    restart: unless-stopped
    networks:
      - kairix-net

  # ===========================================================================
  # Kokoro TTS Server
  # ===========================================================================

  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    container_name: kokoro-tts
    ports:
      - "8880:8880"
    environment:
      - USE_GPU=true
      - DOWNLOAD_MODEL=true
      - CUDA_VISIBLE_DEVICES=1
    devices:
      - nvidia.com/gpu=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Model download/loading
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    restart: unless-stopped
    networks:
      - kairix-net

  # ===========================================================================
  # APPLICATION SERVICES (profile: app)
  # ===========================================================================

  kairix-server:
    build:
      context: ..
      dockerfile: v2-runtime/Dockerfile
    image: kairix-server:latest
    container_name: kairix-server
    command: >
      python -m uvicorn kairix_agent.server.main:app
      --host 0.0.0.0 --port 8000 --workers 1 --log-level info
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://kairix-redis:6379
      - DATABASE_URL=postgresql+asyncpg://kairix:${POSTGRES_PASSWORD:-kairix}@kairix-postgres:5432/kairix
      - LETTA_BASE_URL=http://letta:8283
      - KP3_URL=http://kp3-service:8080
      - LOG_LEVEL=INFO
      - ENABLE_TRACING=${ENABLE_TRACING:-true}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://openobserve:5081
      - OTEL_EXPORTER_OTLP_USER=admin@kairix.local
      - OTEL_EXPORTER_OTLP_PASSWORD=kairix123
      # TTS Configuration
      - TTS_PROVIDER=${TTS_PROVIDER:-kokoro}
      - KOKORO_URL=http://kokoro-tts:8880/v1
      - KOKORO_VOICE=${KOKORO_VOICE:-af_heart}
      - KOKORO_SPEED=${KOKORO_SPEED:-1.2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      letta:
        condition: service_started
      openobserve:
        condition: service_started
      kokoro-tts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/hello"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: always
    networks:
      - kairix-net
    profiles:
      - app

  kairix-worker:
    build:
      context: ..
      dockerfile: v2-runtime/Dockerfile
    image: kairix-worker:latest
    container_name: kairix-worker
    command: python -m saq kairix_agent.worker.settings --verbose
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://kairix-redis:6379
      - DATABASE_URL=postgresql+asyncpg://kairix:${POSTGRES_PASSWORD:-kairix}@kairix-postgres:5432/kairix
      - LETTA_BASE_URL=http://letta:8283
      - KP3_URL=http://kp3-service:8080
      - LOG_LEVEL=INFO
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://openobserve:5081
      - OTEL_EXPORTER_OTLP_USER=admin@kairix.local
      - OTEL_EXPORTER_OTLP_PASSWORD=kairix123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      letta:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/1/cmdline | tr '\\0' ' ' | grep -q saq"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: always
    networks:
      - kairix-net
    profiles:
      - app

  kp3-service:
    build:
      context: ..
      dockerfile: kp3/Dockerfile
    image: kp3-service:latest
    container_name: kp3-service
    command: kp3-service
    ports:
      - "8080:8080"
    environment:
      - KP3_DATABASE_URL=postgresql+asyncpg://kairix:${POSTGRES_PASSWORD:-kairix}@kairix-postgres:5432/kp3
      - KP3_QUERY_HOST=0.0.0.0
      - KP3_QUERY_PORT=8080
      - CUDA_VISIBLE_DEVICES=1
    devices:
      - nvidia.com/gpu=all  # GPU passthrough via CDI
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # vLLM model loading takes time
    deploy:
      resources:
        limits:
          memory: 8G  # vLLM needs more memory
        reservations:
          memory: 4G
    restart: always
    networks:
      - kairix-net
    profiles:
      - app

  # ===========================================================================
  # One-shot Runners (profile: migrate, cli)
  # ===========================================================================

  migrate:
    build:
      context: ..
      dockerfile: v2-runtime/Dockerfile
    image: kairix-server:latest
    container_name: kairix-migrate
    command: python -m alembic upgrade head
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://kairix:${POSTGRES_PASSWORD:-kairix}@kairix-postgres:5432/kairix
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kairix-net
    profiles:
      - migrate

  kp3:
    build:
      context: ..
      dockerfile: kp3/Dockerfile
    image: kp3-service:latest
    container_name: kp3-cli
    # Usage: docker compose run --rm kp3 kp3 <command>
    # Examples:
    #   docker compose run --rm kp3 kp3 passage search "query"
    #   docker compose run --rm kp3 kp3 passage ls
    #   docker compose run --rm kp3 kp3 run ls
    command: ["echo", "Usage: docker compose run --rm kp3 kp3 <command>"]
    environment:
      - KP3_DATABASE_URL=postgresql+asyncpg://kairix:${POSTGRES_PASSWORD:-kairix}@kairix-postgres:5432/kp3
    devices:
      - nvidia.com/gpu=all
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kairix-net
    profiles:
      - cli

  voice-admin:
    build:
      context: ..
      dockerfile: v2-runtime/Dockerfile
    image: kairix-server:latest
    container_name: kairix-voice-admin
    # Usage: docker compose run --rm voice-admin voice-admin <command>
    # Examples:
    #   docker compose run --rm voice-admin voice-admin list
    #   docker compose run --rm voice-admin voice-admin add
    #   docker compose run --rm voice-admin voice-admin assign
    command: ["echo", "Usage: docker compose run --rm voice-admin voice-admin <command>"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://kairix:${POSTGRES_PASSWORD:-kairix}@kairix-postgres:5432/kairix
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kairix-net
    profiles:
      - cli

  sessions-admin:
    build:
      context: ..
      dockerfile: v2-runtime/Dockerfile
    image: kairix-server:latest
    container_name: kairix-sessions-admin
    # Usage: docker compose run --rm sessions-admin sessions-admin <command>
    # Examples:
    #   docker compose run --rm sessions-admin sessions-admin status
    #   docker compose run --rm sessions-admin sessions-admin list-failed
    #   docker compose run --rm sessions-admin sessions-admin recover
    #   docker compose run --rm sessions-admin sessions-admin recover --dry
    command: ["echo", "Usage: docker compose run --rm sessions-admin sessions-admin <command>"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://kairix:${POSTGRES_PASSWORD:-kairix}@kairix-postgres:5432/kairix
      - LETTA_BASE_URL=http://letta:8283
      - REDIS_URL=redis://kairix-redis:6379/0
      - KP3_URL=http://kp3-service:8080
    depends_on:
      postgres:
        condition: service_healthy
      letta:
        condition: service_started
      redis:
        condition: service_healthy
      kp3-service:
        condition: service_healthy
    networks:
      - kairix-net
    profiles:
      - cli
