version: '3.8'

services:
  neo4j:
    image: neo4j:latest
    container_name: kairix-neo4j
    profiles: ["with-neo4j"]             # Only starts with --profile with-neo4j
    ports:
      - "0.0.0.0:7474:7474"              # HTTP interface
      - "0.0.0.0:7687:7687"              # Bolt protocol
    volumes:
      - ./neo4j/data:/data               # Database data
      - ./neo4j/logs:/logs               # Logs
      - ./neo4j/import:/var/lib/neo4j/import  # Import directory
      - ./neo4j/plugins:/plugins         # Custom plugins
    environment:
      # Authentication
      - NEO4J_AUTH=neo4j/password

      # Enable plugins including GenAI for vector operations
      - NEO4J_PLUGINS=["apoc", "genai"]

      # APOC settings
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true

      # Memory configuration for better performance with embeddings
      - NEO4J_server_memory_pagecache_size=512M
      - NEO4J_server_memory_heap_initial__size=512M
      - NEO4J_server_memory_heap_max__size=8G

      # Enable procedures unrestricted for vector operations
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,genai.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,genai.*
